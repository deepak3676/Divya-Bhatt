<div class="my-24 mt-24 lg:mt-48">

    <div class="main" id="skills">
        <div class="video-section-container" data-aos="zoom-in">
            <div class="video-header">
                <h1 class="skills-heading text-center">A Little About Me</h1>
                <p class="subTitle skills-text text-center">Watch my creative process in action 🎨</p>
            </div>

            <div class="video-wrapper" (click)="playVideo($event)">
                <video #introVideo controls preload="none" poster="assets/images/portfolio-logo.png">
                    <source src="assets/video/divichan.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>

                <div class="play-overlay" *ngIf="!videoStarted">
                    <div class="play-button">
                        <i class="fas fa-play"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="skills-header-div my-8" data-aos="fade-up">

            <h1 class="skills-header">
                What I Do?
            </h1>
        </div>
        


        @for (ab of appConfig.aboutMe; track $index) {

        <div class="skills-main-div">

            <div class="skills-image-div" data-aos="fade-right">
                <img [src]="ab.imagePath" [alt]="ab.sectionTitle">
            </div>

            <div class="skills-text-div" data-aos="fade-left">
                <h1 class="skills-heading">
                    {{ ab.sectionTitle }}
                </h1>

                <div class="social-media-div">

                    @for (l of ab.skillLinks; track $index) {
                    <a [href]="l.link" target="_blank" rel="noopener noreferrer" class="icon-button" [title]="l.name">

                        <div class="img-container" [ngStyle]="{'backgroundColor': l.backgroundColor}">
                            <img src="{{ assetPaths.SIMPLE_ICONS }}/{{ l.simpleIconName }}.svg" />
                        </div>

                    </a>
                    }
                </div>

                <div>

                    @for (sl of ab.skillsList; track $index) {
                    <p class="subTitle skills-text">
                        ⚡ {{ sl }}
                    </p>
                    }

                </div>
            </div>
        </div>
        }
        


    </div>
</div>
