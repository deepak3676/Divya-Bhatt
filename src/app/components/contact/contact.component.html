<div class="flex my-8 mx-auto flex-wrap md:flex-nowrap contact-card">
    <div class="md:w-64 md:mb-0 mb-6 flex-shrink-0 flex flex-col mx-auto align-center justify-center" data-aos="fade-right">
        
        <div class="contact-icon-wrapper mx-auto">
            <i class="fa-solid fa-paper-plane text-4xl text-indigo-500"></i>
        </div>

        <span class="font-semibold my-4 title-font text-gray-700 text-center uppercase tracking-widest">
            Let's Collaborate
        </span>

        <span class="text-sm title-font text-green-600 text-center italic">
            ● Available for Freelance
        </span>
    </div>

    <div class="md:flex-grow w-full px-4" data-aos="fade-left">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">
            Send me a message
        </h2>
        
        <p class="mt-3 text-gray-600 text-lg mb-6">
            Got a vision? I have the tools. Fill out the form below and I'll get back to you within 24 hours.
        </p>

        <form (submit)="sendEmail($event)" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" name="from_name" placeholder="Name" required
                    class="w-full bg-gray-100 rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
                
                <input type="email" name="reply_to" placeholder="Email" required
                    class="w-full bg-gray-100 rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">
            </div>

            <input type="text" name="subject" placeholder="Subject" required
                class="w-full bg-gray-100 rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out">

            <textarea name="message" placeholder="Message" required rows="4"
                class="w-full bg-gray-100 rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 h-32 text-base outline-none text-gray-700 py-1 px-3 resize-none leading-6 transition-colors duration-200 ease-in-out"></textarea>

            <button type="submit" 
                class="text-white bg-indigo-500 border-0 py-2 px-8 focus:outline-none hover:bg-indigo-600 rounded text-lg flex items-center gap-2">
                Send Message
                <i class="fa-solid fa-share-from-square"></i>
            </button>
        </form>
    </div>
</div>
